<title>Para Damaris</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;--ink:#eef3ff;--soft:#a9bbe6;--glow:#7fb2ff;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;transition:color 2.5s}

.sky{position:fixed;inset:0;opacity:0;transition:opacity 3s ease;z-index:-3;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px;max-width:560px;margin:1.4em auto .8em}
.env{position:relative;overflow:hidden;padding:0;margin:0;border:0;border-radius:6px;aspect-ratio:1.4;background:var(--ec);animation:envf 4s ease-in-out infinite;transition:filter .3s}

.env::after{content:attr(data-n);position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#e8334f;color:#fff;font:600 .85rem Georgia,serif;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}

#lm{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,6,15,.8);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);padding:20px;transition:backdrop-filter 4s ease,-webkit-backdrop-filter 4s ease}

.paper{--pc:#7fb2ff;transition:filter 4s ease,opacity 4s ease;position:relative;max-width:560px;width:100%;max-height:82svh;overflow:auto;background:linear-gradient(#fffaf0,#fdeedd);color:#4a2a2a;border-radius:14px;padding:30px 26px 22px;border:2px solid var(--pc);box-shadow:0 0 60px var(--pc);transform:translateY(30px) scale(.94);animation:rise .7s forwards;text-align:left}
@keyframes rise{to{transform:none}}
.paper h3{margin:0 0 .8em;font-weight:400;font-size:1.5rem;letter-spacing:.05em;color:var(--pc);filter:brightness(.7);text-align:center}
.paper p{opacity:1;transform:none;white-space:pre-wrap;font-size:1.1rem;line-height:1.85;min-height:6em}
.paper button{color:#4a2a2a;border-color:var(--pc);background:transparent;margin:0;padding:.3em 1em}

.nav{display:flex;justify-content:space-between;margin-top:.6em}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) rotate(240deg) scale(.4);opacity:0}}
#lm.fx{-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
#lm.fx .paper{filter:blur(18px);opacity:.3}
#lm.on.shk{animation:fi .5s,shake .1s infinite}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-8px)}60%{transform:translate(-7px,-5px)}80%{transform:translate(8px,7px)}100%{transform:translate(0,0)}}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff,#ffb3d4 35%,rgba(255,92,154,0) 70%);animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.whisper{position:fixed;z-index:35;pointer-events:none;color:#fff;font:italic clamp(1.4rem,6vw,2.6rem) Georgia,serif;letter-spacing:.08em;text-shadow:0 0 22px #ff5c9a,0 0 40px #ff2f92;animation:wh 2.7s ease-in-out forwards}
@keyframes wh{0%{opacity:0;filter:blur(10px);transform:scale(.85)}30%{opacity:.95;filter:blur(1.5px)}100%{opacity:0;filter:blur(12px);transform:scale(1.2)}}
.moon{position:absolute;top:12%;right:10%;width:14vmin;height:14vmin;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#dfe8ff 60%,#9fb4e8);box-shadow:0 0 60px 12px rgba(180,205,255,.35);animation:mo 9s ease-in-out infinite}
@keyframes mo{50%{transform:translateY(14px)}}

<script>
// ===== EDITA AQUÍ =====
var SIGN='Con cariño eterno, Ismael';
var PREVIEW_BTN=false; // botón de vista previa en la pantalla bloqueada; ponlo en false antes de enviárselo
var UNLOCK=new Date(2026,11,24,0,0,0); // para probar antes: añade #preview al final del enlace
var LETTERS=[
{t:'Espejos que revelan',x:`Son espejos que no reflejan,
sino que revelan lo oculto,
dos enigmas que me miran
y me obligan a pensar en lo eterno.
En su brillo cabe la duda,
y en su sombra cabe la calma;
cuando los encuentro, descubro
que la verdad no se dice, se siente.
No son mirada, son destino,
no son color, son camino;
y en ellos me pierdo,
como quien se entrega al infinito.`},
{t:'Dichoso',x:`Dichoso soy, pues tu llegada fue un amanecer en mi historia; conocerte es llevar en el pecho un sol que nunca se apaga.`},
{t:'La constelación que aprendió tu nombre',x:`Para Damaris, la niña que convirtió la noche en poesía

Damaris,
Anoche el cielo estaba callado, como un río dormido, como un jardín escondido, como un sueño olvidado.
Las estrellas parecían pequeñas lámparas colgadas del silencio, pero ninguna brillaba tanto como el recuerdo de tu existencia. Fue entonces cuando comprendí algo extraño: el universo conoce millones de nombres, pero ninguno lo pronuncia el viento con tanta dulzura como el tuyo.
Tu nombre no es un nombre cualquiera.
Es campana, es melodía, es caricia, es alegría.
Cuando lo digo, el corazón se inclina, la nostalgia camina, y la esperanza se ilumina.
A veces imagino que las estrellas se reúnen por las noches para hablar de ti.
Una presume tu sonrisa, otra presume tus ojos, otra cuenta que el color azul se volvió hermoso porque decidió parecerse un poco a tu alma.
Y mientras ellas conversan, la luna escucha callada, porque sabe que existe una verdad sagrada:
que entre tantas personas, entre tantas historias, entre tantos destinos, hay una muchacha capaz de transformar memorias.
Porque tú no pasas por la vida, la decoras.
No caminas, inspiras.
No sonríes, iluminas.
Y aunque tal vez no lo notes, dejas pequeños milagros en las esquinas.
Damaris, si algún día la tristeza llega a visitarte, quiero que recuerdes esto:
Las flores no piden permiso para florecer, las estrellas no piden permiso para brillar, y tu corazón tampoco necesita permiso para ser especial.
Porque desde el instante en que llegaste a este mundo, el cielo escribió sobre el viento una verdad sencilla:
Que había nacido alguien preciosa, maravillosa, hermosa, y absolutamente inolvidable.

Con cariño eterno, Ismael`},
{t:'El jardín de los segundos',x:`Para la chica que vuelve eternos los momentos

Damaris,
Hay personas capaces de ocupar años de recuerdos.
Y luego estás tú, que eres capaz de ocupar una eternidad dentro de un solo segundo.
Es extraño.
Porque algunas personas cuentan el tiempo con relojes.
Yo lo cuento contigo.
Existe un antes de conocerte y un después de conocerte.
Antes, los días eran simplemente días.
Después, cada hora empezó a tener colores, cada recuerdo empezó a tener brillo, cada pensamiento comenzó a llevar tu nombre escondido.
A veces imagino que el tiempo es un jardín.
Las horas son flores.
Los minutos son hojas.
Los segundos son pétalos.
Y entre todo ese paisaje existe una flor imposible de ignorar.
Esa flor eres tú.
La más bella.
La más sencilla.
La más brillante.
La que convierte cualquier paisaje en algo más radiante.
Si una mañana llega la lluvia, seguirás siendo flor.
Si llega el invierno, seguirás siendo flor.
Si el mundo cambia, seguirás siendo flor.
Porque tu belleza no depende de las estaciones.
Nace de tu esencia.
Y esa esencia es tan hermosa que incluso la tristeza se vuelve menos pesada cuando aparece tu recuerdo.
Damaris, quisiera guardar cada instante donde existes.
Las risas.
Las palabras.
Los silencios.
Los detalles.
Porque incluso las cosas pequeñas que te pertenecen parecen estar hechas de magia.
Y si algún día el tiempo me pregunta qué fue lo más hermoso que vi pasar por sus caminos,
responderé sin dudar:
"Una muchacha llamada Damaris."
Porque hay segundos que desaparecen.
Pero también existen personas capaces de quedarse para siempre.`},
{t:'El idioma de tus ojos',x:`Para la dueña de las miradas que cuentan historias

Damaris,
He llegado a una conclusión curiosa.
Tus ojos conocen un idioma que nadie enseña.
No aparece en libros.
No se estudia en escuelas.
No necesita traducciones.
Simplemente se siente.
Hay personas que hablan con palabras.
Tú hablas con miradas.
Y vaya que dicen cosas.
A veces hablan de ternura.
A veces de alegría.
A veces esconden sueños.
Y otras veces parecen guardar galaxias completas.
Cuando imagino tus ojos, no veo solamente una mirada.
Veo mares.
Veo mundos.
Veo universos.
Porque tienen algo difícil de explicar.
Algo que transforma lo sencillo en extraordinario.
Quizá por eso los poetas escriben tanto.
Porque existen cosas demasiado hermosas para quedarse en silencio.
Y tú eres una de ellas.
Damaris, si tus ojos fueran estrellas, el cielo tendría envidia.
Si fueran océanos, las olas aprenderían a bailar.
Si fueran música, las canciones jamás terminarían.
Porque poseen una belleza tranquila.
Una belleza que no necesita presumirse.
Una belleza que existe simplemente porque sí.
Y es precisamente por eso que resulta imposible olvidarla.
El día que el universo decidió crear tu mirada, seguramente tomó pedazos de amanecer, migajas de luna, chispas de estrellas y una cantidad exagerada de magia.
Porque otra explicación no encuentro.
Solo sé que existen miradas bonitas.
Y luego está la tuya.
Que juega en otra categoría.`},
{t:'Lo que aprendí contigo',x:`Contigo aprendí que hay llamadas que valen más que cualquier regalo.
Que cuidar mascotas virtuales puede ser, en el fondo, una forma de cuidarse el corazón.
Que la lealtad se nota en lo pequeño: en responder, en quedarse, en escuchar.
Aprendí que se puede ser dramática y preciosa a la vez, y que esa mezcla es irresistible.
Gracias por enseñarme que querer es más que decir "te quiero": es estar.
Y aunque hoy cada quien siga su camino, esa lección ya vive en mí.`},
{t:'Un poema que camina',x:`Damaris, cada vez que pienso en ti siento que el mundo se detiene, como si el tiempo mismo se quedara sin palabras frente a la perfección que llevas en tu mirada. Tus ojos… ay tus ojos, son como un universo entero escondido en dos destellos, como si la luna y el sol hubieran decidido encontrarse en tu rostro para recordarme que la belleza verdadera existe de verdad. No hay forma de mirarlos sin sentir que todo lo demás pierde sentido, porque en ellos cabe la calma que necesito, la locura que me enciende y la ternura que me salva.

Es que tú no eres solo bonita, tú eres un poema que camina, una canción que respira, un milagro que se repite cada vez que apareces. Tu sonrisa es un hechizo que no se rompe, tus gestos son poesía que sale de ti, suena como música que no se olvida. Hasta el silencio contigo se vuelve arte, porque incluso cuando no dices nada, tu presencia habla más fuerte que cualquier discurso.

Y no exagero, Damaris, cuando digo que eres la definición de perfección. Desde la forma en que caminas, con esa seguridad que parece bailar con el viento, hasta la manera en que respiras, como si el aire mismo se sintiera orgulloso de entrar en ti. Todo en ti es armonía, todo en ti es fuerza, todo en ti es belleza.

A veces me pregunto cómo es posible que alguien como tú exista, y la respuesta que encuentro es que el universo se puso creativo, que Dios se inspiró de más, que la vida quiso regalarme un ejemplo vivo de lo que significa la palabra “Única”. Porque tú no eres copia de nadie, tú eres original, auténtica, y eso te hace brillar más que cualquier estrella.

Tus ojos, Damaris, son la prueba de que la perfección no se inventa, se encuentra. Son la prueba de que el orgullo puede mentir, pero la mirada nunca. Y cuando me miras, siento como si fueras espejo y destino al mismo tiempo.

Podría pasar horas describiendo lo que siento, y aun así me quedaría corto. Porque no hay palabras suficientes para explicar lo que significa verte, escucharte, sentirte cerca. Eres la calma que me rescata en los días grises, eres la chispa que me enciende cuando parece apagarse, eres la razón por la que creo que la perfección no es un mito.

Y aunque mi ortografía se escape en algún detalle, aunque mis frases no siempre estén bien escritas, lo que siento por ti no necesita corrección. Porque lo que digo sale del corazón, y el corazón no entiende de reglas, solo de verdades. Y la verdad es que tú, Damaris, eres perfecta. Perfecta en tus ojos, perfecta en tu sonrisa, perfecta en tu forma de ser, perfecta en todo lo que eres.

Así que, si alguien me preguntara qué es la perfección, yo no hablaría de matemáticas, ni de ciencia, ni de teorías. Yo simplemente diría tu nombre: Damaris. Porque tú eres la prueba viva de que lo perfecto existe.`},
{t:'La muchacha que el viento no pudo llevarse',x:`Para quien permanece en cada recuerdo

Damaris,
Hoy el viento soplaba fuerte.
Arrastraba hojas.
Movía ramas.
Empujaba nubes.
Parecía decidido a llevarse todo.
Pero mientras observaba el cielo, pensé en ti.
Y comprendí algo.
Hay cosas que el viento jamás podrá llevarse.
Tu recuerdo es una de ellas.
Porque algunos recuerdos son ligeros.
Pero otros tienen raíces.
Profundas.
Fuertes.
Inquebrantables.
Como los árboles que sobreviven tormentas.
Como las montañas que no retroceden.
Como las estrellas que siguen brillando incluso en la distancia.
Así es el recuerdo que tengo de ti.
No importa cuánto tiempo pase.
No importa cuántos días cambien.
No importa cuántas estaciones se marchen.
Siempre permanece.
Y eso me parece hermoso.
Porque significa que existen personas que dejan huellas.
Y tú no dejaste una huella.
Dejaste un camino completo.
Un camino lleno de sonrisas, de pensamientos, de memorias y de momentos imposibles de borrar.
Damaris, si la vida fuera un libro gigantesco, muchas personas serían palabras.
Otras serían frases.
Pero tú serías un capítulo entero.
Uno de esos capítulos que nadie quiere terminar.
Porque cuanto más se lee, más hermoso parece.
Y aunque el viento siga intentando llevarse cosas,
sé que jamás podrá llevarse aquello que nació para permanecer.`},
{t:'Todo lo dulce',x:`Si el amor tuviera sabor, el tuyo sería a pastel recién hecho.
A postre preparado con paciencia, con las manos llenas de harina y el corazón lleno de ganas.
Tienes algo de sushi también: bonito, delicado y siempre una sorpresa.
Y un poco de balón de baloncesto: constante, con ritmo y con puntería para acertar justo donde más se siente.
Y los perros, claro. Porque quien ama a los perros sabe querer sin condiciones.
Todo lo dulce del mundo me recuerda a ti.`},
{t:'El castillo construido con sueños',x:`Para la princesa de mis pensamientos más bonitos

Damaris,
Existe un castillo que nadie conoce.
No aparece en mapas.
No puede encontrarse en fotografías.
No figura en ningún reino.
Porque está construido dentro de mis pensamientos.
Y curiosamente, cada una de sus paredes tiene algo de ti.
Los jardines poseen tu dulzura.
Las torres guardan tu belleza.
Las ventanas reflejan tu alegría.
Y los pasillos conservan el eco de tu nombre.
En ese lugar imaginario, las flores nunca se marchitan.
Las estrellas nunca se apagan.
Los amaneceres nunca llegan tarde.
Porque todo fue diseñado para parecerse a la sensación que produce recordarte.
Y créeme.
Es un lugar hermoso.
Hay fuentes que cantan melodías.
Hay cielos pintados de azul.
Hay pétalos flotando sobre el viento.
Y en el centro de todo existe un trono.
No de oro.
No de diamantes.
Sino de recuerdos.
Porque los recuerdos contigo valen más que cualquier tesoro.
Damaris, si algún día pudieras visitar ese castillo, descubrirías algo curioso.
